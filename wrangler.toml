name = "giulia-personal-planner"
main = "src/index.ts"
compatibility_date = "2026-08-11"
compatibility_flags = ["nodejs_compat"]

# The built PWA is served straight from the Worker. No second host, no CORS.
[assets]
directory = "web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# API requests must reach Hono before the SPA fallback. Without this rule,
# Cloudflare Static Assets returns index.html for /api/* and the browser sees a
# JSON parsing error during setup instead of the Worker's response.
run_worker_first = ["/api/*"]

# Dedicated production resources. Local development still uses isolated
# Miniflare state unless a binding is explicitly marked remote.
[[d1_databases]]
binding = "DB"
database_name = "giulia-personal-planner-db"
database_id = "a62e0638-9fb6-4039-a4d9-ae3c4d86d8c9"
migrations_dir = "migrations"

# Short-lived cache: Google/Notion payloads, dedupe keys for cron jobs.
[[kv_namespaces]]
binding = "CACHE"
id = "6ef602fab3294c6caea22cb18f486ebe"

# Runs every 5 minutes. The handler resolves what is actually due in
# Europe/Rome local time, so DST and the variable "30 min after the shift
# ends" trigger both work without a second cron entry.
[triggers]
crons = ["*/5 * * * *"]

[vars]
APP_TIMEZONE = "Europe/Rome"
APP_LOCALE = "it-IT"
ENVIRONMENT = "production"

[observability]
enabled = true

# ---------------------------------------------------------------------------
# Secrets — set with `wrangler secret put <NAME>`, never in this file:
#
#   MASTER_KEY            base64 32 bytes. Encrypts credentials at rest.
#   ANTHROPIC_API_KEY     Claude API key.
#   NOTION_TOKEN          Notion internal integration token.
#   GOOGLE_CLIENT_ID      OAuth client (Desktop or Web).
#   GOOGLE_CLIENT_SECRET
#   GOOGLE_REFRESH_TOKEN  Obtained once via scripts/google-auth.mjs.
#   VAPID_PUBLIC_KEY      Web Push. Generate with scripts/gen-keys.mjs.
#   VAPID_PRIVATE_KEY
#   VAPID_SUBJECT         e.g. mailto:you@example.com
# ---------------------------------------------------------------------------
